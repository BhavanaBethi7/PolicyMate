services:
  # Backend Service
  - type: web
    name: policymate-backend
    env: node
    buildCommand: "npm install && cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # Frontend Service (Static)
  - type: web
    name: policymate-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://policymate-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
